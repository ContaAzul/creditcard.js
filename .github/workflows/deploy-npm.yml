name: Publish package

on:
  push:
    branches:
      - master

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC with npmjs
      contents: write
    if: "!contains(github.event.head_commit.message, 'chore: release v')"
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
      COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}

    steps:
      - name: Fix up git URLs
        run: echo -e '[url "https://github.com/"]\n  insteadOf = "git@github.com:"' >> ~/.gitconfig

      # Checkout the repo
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          token: ${{ secrets.GH_TOKEN }}

      # Configure git
      - name: Configure CI Git User
        run: |
          git config --global user.name "$COMMIT_AUTHOR_NAME"
          git config --global user.email "$COMMIT_AUTHOR_EMAIL"
          git remote set-url origin https://$GITHUB_ACTOR:$GH_TOKEN@github.com/ContaAzul/creditcard.js

      # Setup Node.js build environment
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Cache dependencies
      - name: Cache Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            **/node_modules
          key: yarn-4x-${{ hashFiles('**/package.json', 'yarn.lock') }}

      # Install project dependencies
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn

      # Build the project
      - name: Build
        run: yarn build

      # Release and publish version
      - name: Release version
        run: yarn release --ci --npm.skipChecks
